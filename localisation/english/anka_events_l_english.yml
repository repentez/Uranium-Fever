 ISR_2_desc:0 ""Despicable.. despicable beyond words.." As the Israeli president addresses the nation following a nuclear detonation in the city of Tel-Aviv."
 superevents.euc_collapse.t:0 "Europe Collapses!"
 superevents.euc_collapse.d:0 "Following the devastating war between the commonwealth and the Arab coalition, both sides have exhausted its own populace as unrests occur across France, Italy, Germany. Council president insists that Europe is to be stable but heckled on the stage as angry residents tried dragging him out. Factions began forming media to promote and recruit its fighters against each others. The promises of the post-WW2 world is shattered and may be lost forver.."
 great.war.1.t:0 "The End of the World as we know it"
 great.war.1.d:0 "Oct 23 2077, the United States defense command detected imminent nuclear strikes from the shores of San Francisco believing to be Chinese submarines doing so. Nuclear fireballs ravage across America and in retaliation, China and Asia. As the nuclear catastrophe consumes civilization, the rest of the countries launch their nuclear arsenals too."
