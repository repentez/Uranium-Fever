 superevents.greatwar.t:0 "The Great War"
 superevents.1.t:0 "The End of the World as We Know It"
 superevents.1.d:0 "October 23, 2077. The United States defense command has detected what it believes to be an imminent nuclear strike, believed to have originated from Chinese submarines off the coast of San Francisco.\nThere is little time to wonder if the warning is true.\nThen, the sky burns.\nNuclear fire rises over America. Cities disappear beneath columns of smoke and dust. Across the Pacific, China answers in kind. Sirens become screams. Radios fall silent. The great powers empty their arsenals upon one another, and the world that spent a century preparing for this moment finally arrives at it.\nFor a few terrible hours, mankind remembers everything it was capable of.\nAnd then, there is silence.\nThe governments that promised to protect us vanish. The armies that marched beneath a hundred flags are buried beneath the same ash. Borders, treaties, ideologies, nations—everything that once seemed so permanent becomes meaningless beneath the mushroom cloud.\nPerhaps this is what the world was always becoming.\nPerhaps there was nothing left to save.\nThe fires will burn. The ruins will cool. And, someday, someone will walk among them and wonder whwe were thinking.\nFor now, there is only the silence.\nGoodbye, old world.\nWe'll meet again..."
 superevents.1.a:0 "So Long..."
