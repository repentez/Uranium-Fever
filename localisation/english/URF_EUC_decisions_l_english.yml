EUC_dismantle_nationalist_networks_decision: "Dismantle Separatist Networks"
EUC_dismantle_nationalist_networks_decision_desc: "Use information gathered by Union intelligence to systematically dismantle separatist organizations and sever their connections."

EUC_detain_prominent_agitators_decision: "Detain Prominent Agitators"
EUC_detain_prominent_agitators_decision_desc: "Detain prominent separatist activists and organizers before they can further mobilize opposition to the Union."

