 USA.mexico_no_altere_event_title:0 "No Altere El Orden Establecido"
 USA.mexico_no_altere_event_desc:0 "Mexico gets an event about Generalissimo being told to stay loyal as the US stops watching every move they make. Spend political power, as you get him a nice gift. Decrease their autonomy significantly."
 USA.mexico_no_altere_event_option:0 "Thank u Uncle Sam"





  uranium_fever.1.t:0 "Welcome to Uranium Fever!"
 uranium_fever.1.desc:0 "Thank you for taking the time to playtest Uranium Fever! The mod is still in development, and your feedback, suggestions, and bug reports are incredibly valuable to us. We hope you enjoy exploring what we've created so far. If you encounter any bugs or have ideas that could help us improve the mod, please join our Discord and let us know. Your support and patience during development mean a lot to the team!"
