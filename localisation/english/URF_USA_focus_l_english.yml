 USA_Strikes:0 "Widespread Strikes"
 USA_focus_distributing_desc:0 "Relations between the native-born and the newcomers have turned from tension into open hostility. Neighborhoods are divided, workplaces are split, and the clashes between locals and immigrants grow more frequent every month. Its better if we stop all of thise!"
