 USA_cascadian_commonwealth:0 "The Northwest Commonwealth"
 USA_cascadian_commonwealth_desc:0 "Our northern territories remain dangerously exposed, both by sea and by air. Before tensions with China boil over, Washington must invest in their defense — securing the Pacific coast and watching the skies to the north."
 usa_northern_commonwealth:0 "The Northern Commonwealth"
 usa_northern_commonwealth_desc:0 "Build a radar and air defense network across our northern states. If China ever strikes from across the Pole, we'll see it coming."
