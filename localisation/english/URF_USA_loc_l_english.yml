#Leaders

 POLITICS_WILLIAM_H_CALDWELL_DESC: "William Henry Caldwell is a man who came to Washington believing that America could still be governed the old-fashioned way. Born in Ohio, Caldwell spent much of his early career in the Senate, where he developed a reputation as a pragmatic, conservative Republican. He wasn't particularly charismatic, nor did he possess the grand ideological vision of some of his predecessors. What he did possess, however, was patience, experience, and an almost old-fashioned faith in the institutions of the United States. It was with this reputation that Caldwell won the 2048 presidential election, promising stability in an increasingly unstable world. Unfortunately for him, stability was perhaps the one thing that the 2050s had no intention of providing. The Resource Wars had begun, energy prices were spiralling out of control, and America's increasingly desperate efforts to secure oil were placing Washington at odds with much of the world. The invasion of Mexico had secured a temporary lifeline, but even Caldwell could see that it wasn't a solution to the crisis. Then, in 2052, the European Commonwealth went to war with the Middle East. For Caldwell, this was the moment when the world he had spent his career trying to preserve finally began to come apart. The United Nations collapsed, international cooperation became little more than a memory, and governments across the world began preparing for a future where there might not be enough resources for everyone. Caldwell responded with calls for restraint, negotiation, and the preservation of the international order. Few were listening. By the time Caldwell entered his final year in office, he had become a lame duck in every sense of the word. His political capital was dwindling, his party was already looking towards the next administration, and his ability to shape events was rapidly being overtaken by them. Yet Caldwell continued to work. Briefings ran late into the night, cabinet meetings became increasingly grim, and the President found himself spending more time with military advisers than with political ones. The destruction of Tel Aviv in December 2053 would be one of the final crises of his presidency. Caldwell had spent years believing that nuclear war was something that responsible governments could prevent through careful diplomacy. Now, he was watching the Middle East burn while his own advisers prepared for the possibility that America might one day have to fight its way through the same nightmare. There is something almost tragic about Caldwell's presidency. He wasn't a tyrant, a revolutionary, or a great statesman. He was simply a man who believed that the old rules still mattered at a time when the world had begun discarding them. When he finally left office, Caldwell could claim few great victories. He could, however, claim that he had tried to keep the ship afloat. Whether the ship was ever going to stay afloat was another matter entirely."