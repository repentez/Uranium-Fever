BM_HISTORY_TITLE: "Brief History"
GATHERING_STORM_NAME: "PESSIMISM OF THE FUTURE"
GATHERING_STORM_DESC: "After the Second World War, a miracle had occurred. Nuclear energy promised a future of abundance; a world of prosperity, limitless electricity, and humanity reaching beyond the confines of Earth itself. But the promises of the atomic age proved easier to make than to fulfill. By 2052, the world had entered an age of scarcity. Petroleum reserves dwindled, economies strained under rising demand, and the great powers increasingly looked beyond their borders for the resources they could no longer produce themselves. Diplomacy gave way to coercion, and alliances increasingly became instruments of survival. Mexico had already fallen under American occupation. Canada, though still sovereign, watched Washington's growing appetite with increasing unease. Across Europe, Asia, and the Middle East, governments faced their own crises as the international order slowly began to fracture. The world was not yet at war. But the peace that remained was becoming increasingly difficult to distinguish from the preparations for one."
