#Ideas###

 USA_deflation_crisis:0 "Deflation Crisis"
 USA_Oil_Shock:0 "The Oil Shock"

###Focuses###

 usa_focus_commonwealth_hq:0 "A Dying System"
 usa_focus_commonwealth_hq_desc:0 "The Commonwealth system was never meant to last this long. What began as an emergency measure to keep the regions functioning has calcified into the way the country actually runs - and Washington can no longer pretend otherwise. If the Union is to mean anything more than a name on a map, it has to be built, region by region, starting now."
 usa_focus_commonwealth_affairs:0 "Department of Commonwealth Affairs"
 usa_focus_commonwealth_affairs_desc:0 "Washington cannot govern a dozen semi-autonomous Commonwealths through improvisation and goodwill forever. A dedicated department is stood up to coordinate federal investment, settle disputes between the regions, and keep Washington's hand on the wheel - however lightly it may need to rest there."
 usa_focus_pacific_rim:0 "Defense of the Pacific Rim"
 usa_focus_pacific_rim_desc:0 "Fortify the Pacific coast against Chinese naval power. Expand our ports, harden our shores, and prepare the Northwest for the war we hope never comes."
 usa_focus_northern_frontier:0 "Watch of the Northern Frontier"
 usa_focus_northern_frontier_desc:0 "Build a radar and air defense network across our northern states. If China ever strikes from across the Pole, we'll see it coming."
 USA_northern_states:0 "Cascadia and Northern Rockies"
 USA_northern_states_desc:0 "Our northern territories remain dangerously exposed, both by sea and by air. Before tensions with China boil over, Washington must invest in their defense — securing the Pacific coast and watching the skies to the north."
 USA_texas_commonwealth:0 "The Lone Star Commonwealth"
 USA_texas_commonwealth_desc:0 "Texas sits atop some of the richest oil and gas reserves in the country, largely untouched since the reserves were first surveyed decades ago. With energy demand only climbing and tensions abroad threatening our supply lines, Washington can no longer afford to leave that wealth in the ground.\n\nInvestment in the Texas Commonwealth's extraction industry could secure our energy independence for a generation — provided we're willing to commit the capital."
 usa_focus_energy_expansion:0 "Drill, Baby, Drill!"
 usa_focus_energy_expansion_desc:0 "Drill deeper, build wider. With federal backing, Texas oil fields can be brought to full production, feeding refineries and reactors from coast to coast and fr USA_midwest_commonwealth_desc:0 "The Midwest was once the industrial heart of America, but decades of neglect have left its factories aging and its infrastructure crumbling. If the Commonwealth is to pull its weight in the coming years, it needs to be rebuilt from the ground up."
 USA_midwest_commonwealth:0 "The Rustbelt Commonwealth"
 USA_midwest_commonwealth_desc:0 "The Midwest was once the industrial heart of America, but decades of neglect have left its factories aging and its infrastructure crumbling. If the Commonwealth is to pull its weight in the coming years, it needs to be rebuilt from the ground up."
 usa_focus_heartland_reindustrialization:0 "Address Industrial Decline"
 usa_focus_heartland_reindustrialization_desc:0 "Federal investment pours back into the Midwest, modernizing factories and rebuilding the roads and rails that connect them. The heartland rises again."
 USA_four_corners_commonwealth_desc:0 "Arizona, Utah, Colorado, and New Mexico form one of the most exposed stretches of our southern border. With raiders, smugglers, and foreign agitators testing our defenses more each year, these states can no longer be left to fend for themselves."
 usa_focus_border_reinforcement:0 "Build the Wall"
 usa_focus_border_reinforcement_desc:0 "Federal engineers begin work on a chain of hardened bunkers along the southern frontier, giving our garrisons the fortifications they need to hold the line against whatever comes across the border."
 USA_california_commonwealth_desc:0 "California and the desert states hold vast untapped mineral wealth, but decades of underinvestment have left the region's potential locked away beneath the sand. If the Southwest is to become a true engine of American industry, Washington must commit to developing it in earnest."
 usa_focus_desert_expansion:0 "Mojave Initiative"
 usa_focus_desert_expansion_desc:0 "Federal contractors push out into the Nevada desert, breaking ground on new aluminium refineries and processing plants. What was once empty wasteland will soon feed the nation's factories."
 USA_great_plains_commonwealth_desc:0 "Our supply lines across the Plains are choked by aging roads and half-abandoned rail lines. Convoys crawl where they should run, and reinforcements arrive late when they arrive at all. Modernizing this network is long overdue."
 usa_focus_rails:0 "Rail and Road Modernization"
 usa_focus_rails_desc:0 "New track is laid and old roads repaved across the heartland, giving our supply trains the speed they've always lacked. The grain, the steel, and the soldiers will finally move as fast as the nation needs them to."
 usa_focus_commonwealth_act:0 "Hold an "Emergency" Meeting"
 usa_focus_commonwealth_act_desc:0 "Before Washington commits another dollar to the Commonwealths, someone needs to actually go and see what's happening on the ground. Federal auditors and surveyors are dispatched to each region to catalogue what's broken, what's worth saving, and what's already too far gone to matter."
 USA_eastern_commonwealth:0 "The Eastern Commonwealth"
 USA_new_england_commonwealth:0 "The New England Commonwealth"
 USA_gulf_commonwealth:0 "The Gulf Coast Commonwealth"
 usa_focus_gulf_coast_revitalization:0 "Walk Over the White Sands"
 usa_new_cold_war:0 "New Cold War"
 usa_our_hemisphere:0 "The Western Hemisphere"
 usa_focus_limited_intervention:0 "Containment and Assertion"
 usa_focus_only_america:0 "America First and Only One"
 usa_focus_withdraw_commitments:0 "Withdraw Our Commitments"
 usa_focus_review_alliances:0 "No More Free Rides"
 usa_focus_withdraw_soldiers:0 "Bring Our Soldiers Home"
 usa_focus_monroe_doctrine:0 "A New Monroe Doctrine"
 usa_focus_exploit_mexico:0 "Squeeze Mexico Dry"
 usa_focus_diplomacy_latin_america:0 "Phone Call with the Neighbors"
 usa_focus_war_latin_america:0 "Bayonet at their Throat"
 usa_focus_rio_pact_expansion:0 "Reaffirm the Rio Pact"
 usa_focus_rio_pact_expansion_desc:0 "The Rio Pact is a military alliance of the Americas, designed to counter foreign influence in the Western Hemisphere. By expanding its membership and strengthening its commitments, the United States can ensure that our neighbors remain allies rather than adversaries."
 usa_focus_atlantic_reinforcement:0 "The Big Pond"
 usa_focus_pacific_reinforcement:0 "The "Peaceful" Sea"
 usa_focus_patrol_hawaii:0 "Aloha, Hawaii!"
 usa_focus_first_island_chain:0 "The First Island Chain"
 usa_focus_red_dragon:0 "The Perilous Dragon"
 usa_asean_relationships:0 "Smiles of Bangkok"
 usa_asean_relationships_desc:0 "Thailand is our first Asian country to establish ties with, and we keep a good relationship to this day. It is time that we protect our good friends for democracy and stability."
 usa_focus_asean_upgrade_pact:0 "Upgrade the Pact"
 usa_focus_asean_upgrade_pact_desc:0 "With the Chinese looming over Indochina, it is best if we now upgrade our existing treaty with the Kingdom of Thailand to ensure our mutual securities and the stability of the Southeast Asia region."
 usa_focus_east_asian_relationship:0 "Sunrise in Tokyo"
 usa_focus_east_asian_relationship_desc:0 "Referred to the unsinkable carrier, Japan has been one of our important allies after WW2, now it is time that we upgrade a new pact to ensure the security of our interests in the Pacific region."


